# The current dsh CLI rejects --host 0.0.0.0. This deployment patch binds the
# web server to the container interfaces so the Caddy service can proxy it on
# the internal Compose network.
- id: webserver
  config:
    host: 0.0.0.0
    port: 3080

# Opt into the official session-local Schedule tools. Time-context is optional
# for Schedule itself, but lets the model interpret browser-local times before
# it submits an explicit zone to schedule_create.
- insert:
    - id: time-context
      name: '@deepseek-ai/dsh-time-context'

    - id: schedule
      name: '@deepseek-ai/dsh-schedule'
