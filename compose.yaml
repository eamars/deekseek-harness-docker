services:
  deepseek-harness:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DSH_VERSION: ${DSH_VERSION:-0.1.0-rc.6}

    image: deepseek-harness:local
    pull_policy: build
    container_name: deepseek-harness

    environment:
      DSH_HOME: /var/lib/dsh
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}

    # The upstream browser trust fence must receive the LAN authority because
    # the container itself only sees its Docker-network address.
    command:
      - "--trusted-host"
      - "${LAN_HOST:-192.168.2.10}"

    # Harness is available to the HTTPS proxy on the Compose network.
    expose:
      - "3080"

    volumes:
      - dsh-home:/var/lib/dsh
      - dsh-workspace:/workspace

    working_dir: /workspace
    init: true
    restart: unless-stopped

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3080/').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s

  caddy:
    image: caddy:2-alpine
    container_name: deepseek-harness-https
    depends_on:
      deepseek-harness:
        condition: service_healthy

    environment:
      CADDYFILE: |
        http://${LAN_HOST:-192.168.2.10}:80 {
            handle /caddy-local-root.crt {
                root * /data/caddy/pki/authorities/local
                rewrite * /root.crt
                file_server
            }

            handle {
                redir https://${LAN_HOST:-192.168.2.10}:${HTTPS_PORT:-443}{uri} permanent
            }
        }

        https://${LAN_HOST:-192.168.2.10}:443 {
            tls internal

            reverse_proxy deepseek-harness:3080 {
                header_up Host {http.request.host}
            }
        }

    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        printf '%s\n' "$$CADDYFILE" > /tmp/Caddyfile
        caddy fmt --overwrite /tmp/Caddyfile
        exec caddy run --config /tmp/Caddyfile --adapter caddyfile

    ports:
      - "3080:80"
      - "${HTTPS_PORT:-443}:443"

    volumes:
      - caddy-data:/data
      - caddy-config:/config

    restart: unless-stopped

volumes:
  dsh-home:
  dsh-workspace:
  caddy-data:
  caddy-config:
