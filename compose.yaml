services:
  deepseek-harness:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DSH_VERSION: ${DSH_VERSION:-0.1.0-rc.6}

    image: deepseek-harness:local
    container_name: deepseek-harness

    environment:
      DSH_HOME: /var/lib/dsh
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}

    # Publish on all host interfaces so devices on the LAN can connect.
    ports:
      - "3080:3080"

    volumes:
      - dsh-home:/var/lib/dsh
      - ./workspace:/workspace

    working_dir: /workspace
    init: true
    restart: unless-stopped

volumes:
  dsh-home:
